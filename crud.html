<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        max-width: 1000px;
        margin: 0 auto;
        padding: 32px 16px;
        font-family: sans-serif;
        color: #263348;
        background-color: #f3f6fa;
      }

      h1 {
        margin-bottom: 32px;
      }

      h2 {
        font-size: 20px;
      }

      form {
        padding: 24px;
        margin-bottom: 32px;
        background-color: white;
        border: 1px solid #dce3ec;
        border-radius: 12px;
      }

      form div {
        margin-bottom: 16px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input,
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #b8c2d1;
        border-radius: 6px;
        font: inherit;
      }

      input:focus,
      select:focus {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }

      button {
        padding: 9px 16px;
        border: none;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
        color: white;
        background-color: #2563eb;
      }

      button:hover {
        background-color: #1d4ed8;
      }

      button:focus-visible {
        outline: 2px solid #263348;
        outline-offset: 2px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background-color: white;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #dce3ec;
        text-align: left;
      }

      th {
        background-color: #e8eef7;
      }

      tbody tr:hover {
        background-color: #f0f5ff;
      }

      td:last-child {
        white-space: nowrap;
      }

      td button {
        margin: 3px;
      }

      .delete-button {
        background-color: #dc2626;
      }

      .delete-button:hover {
        background-color: #b91c1c;
      }

      .table-container {
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <!-- id, title, destination, startDate, budget, status -->
    <h1>여행 관리</h1>
    <h2>여행 추가</h2>
    <form id="tripForm">
      <div>
        <label for="title">여행 이름</label> <input type="text" id="title" />
      </div>
      <div>
        <label for="destination">여행지</label>
        <input type="text" id="destination" />
      </div>
      <div>
        <label for="startDate">출발일</label>
        <input type="date" id="startDate" />
      </div>
      <div>
        <label for="budget">예산</label> <input type="number" id="budget" />
      </div>
      <div>
        <label for="status">상태</label>
        <select id="status">
          <option value="예정">예정</option>
          <option value="계획중">계획중</option>
          <option value="진행중">진행중</option>
          <option value="완료">완료</option>
        </select>
      </div>
      <button type="submit">추가</button>
    </form>

    <h2>여행 목록</h2>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>여행 이름</th>
            <th>여행지</th>
            <th>출발일</th>
            <th>예산</th>
            <th>상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="tripList"></tbody>
      </table>
    </div>
    <script>
      let trips = [
        {
          id: 1,
          title: "신나는 제주도 여행",
          destination: "제주도",
          startDate: "2025-07-01",
          budget: 300000,
          status: "완료",
        },
        {
          id: 2,
          title: "여행2",
          destination: "장소2",
          startDate: "2023-02-01",
          budget: 200000,
          status: "진행중",
        },
        {
          id: 3,
          title: "여행3",
          destination: "장소3",
          startDate: "2023-03-01",
          budget: 300000,
          status: "완료",
        },
      ];

      const tripForm = document.querySelector("#tripForm");
      const tripList = document.querySelector("#tripList");
      let editingId = null;
      let nextId = 4;

      function renderTrips() {
        tripList.textContent = "";

        trips.forEach(function (trip) {
          const row = document.createElement("tr");
          const values = [
            trip.id,
            trip.title,
            trip.destination,
            trip.startDate,
            trip.budget,
            trip.status,
          ];

          values.forEach(function (value) {
            const cell = document.createElement("td");
            cell.textContent = value;
            row.appendChild(cell);
          });

          const actionCell = document.createElement("td");
          const editButton = document.createElement("button");
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.textContent = "삭제";
          deleteButton.classList.add("delete-button");
          editButton.type = "button";
          editButton.textContent = "수정";

          deleteButton.addEventListener("click", () => {
            if (!confirm("이 여행을 삭제하시겠습니까?")) {
              return;
            }
            trips = trips.filter(function (item) {
              return item.id !== trip.id;
            });

            if (editingId === trip.id) {
              editingId = null;
              tripForm.reset();
              tripForm.querySelector('button[type="submit"]').textContent =
                "추가";
            }
            renderTrips();
          });

          editButton.addEventListener("click", () => {
            editingId = trip.id;

            document.querySelector("#title").value = trip.title;
            document.querySelector("#destination").value = trip.destination;
            document.querySelector("#startDate").value = trip.startDate;
            document.querySelector("#budget").value = trip.budget;
            document.querySelector("#status").value = trip.status;

            tripForm.querySelector('button[type="submit"]').textContent =
              "저장";
          });

          actionCell.appendChild(editButton);

          actionCell.appendChild(deleteButton);
          row.appendChild(actionCell);
          tripList.appendChild(row);
        });
      }

      renderTrips();

      tripForm.addEventListener("submit", (even) => {
        even.preventDefault();

        const title = document.querySelector("#title").value.trim();
        const destination = document.querySelector("#destination").value.trim();
        const startDate = document.querySelector("#startDate").value;
        const budget = parseInt(document.querySelector("#budget").value);
        const status = document.querySelector("#status").value;

        console.log(title, destination, startDate, budget, status);

        if (title.length < 2) {
          alert("여행 이름은 2글자 이상이어야 합니다.");
          document.querySelector("#title").focus();
          return;
        }
        if (destination === "") {
          alert("여행지를 입력하세요.");
          document.querySelector("#destination").focus();
          return;
        }

        if (startDate === "") {
          alert("출발일을 입력하세요.");
          document.querySelector("#startDate").focus();
          return;
        }
        if (Number.isNaN(budget) || budget < 0) {
          alert("예산을 올바르게 입력하세요.");
          document.querySelector("#budget").focus();
          return;
        }
        if (editingId === null) {
          const newTrip = {
            id: nextId,
            title,
            destination,
            startDate,
            budget,
            status,
          };
          trips.push(newTrip);
          nextId++;
        } else {
          const trip = trips.find(function (item) {
            return item.id === editingId;
          });

          trip.title = title;
          trip.destination = destination;
          trip.startDate = startDate;
          trip.budget = budget;
          trip.status = status;
        }
        renderTrips();
        tripForm.reset();

        editingId = null;
        tripForm.querySelector('button[type="submit"]').textContent = "추가";
      });
    </script>
  </body>
</html>
